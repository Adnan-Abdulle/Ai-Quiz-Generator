<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div class="container">
    <h2>User Dashboard</h2>
    <p class="subtitle">Stay organized and complete your assigned quizzes here.</p>

    <div class="card">
      <h3>User Info</h3>
      <p id="userInfo">Loading user info...</p>
    </div>

    <div class="card">
      <h3>Quiz Space</h3>
      <p>Open your assigned quizzes below and submit your answers when ready.</p>
    </div>

    <div class="card">
      <h3>Available Quizzes</h3>
      <div id="availableQuizzes">
        <p>No quizzes assigned yet.</p>
      </div>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
