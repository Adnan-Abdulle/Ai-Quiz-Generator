<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Admin Dashboard</h2>
    <p class="subtitle">Generate and manage quizzes for users.</p>

    <div class="card">
      <h3>Create a Quiz</h3>

      <label for="quizTopic">Quiz Topic</label>
      <input type="text" id="quizTopic" placeholder="Enter topic (e.g. JavaScript, Math, History)" />

      <label for="quizDifficulty">Difficulty</label>
      <select id="quizDifficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label for="quizCount">Number of Questions</label>
      <input type="number" id="quizCount" min="1" max="20" value="5" />

      <button id="generateQuizBtn">Generate Quiz</button>
      <p id="generateMsg"></p>
    </div>


    <div class="card">
      <h3>Generated Quizzes</h3>
      <div id="quizList">
        <p>No quizzes generated yet.</p>
      </div>
    </div>

    <div class="card drawer">
      <div class="drawer-header" onclick="toggleDrawer('quizzesDrawer')">
        <h3>All Quizzes</h3>
        <span class="drawer-icon">▼</span>
      </div>
      <div id="quizzesDrawer" class="drawer-content">
        <div id="teacherQuizList"></div>
      </div>
    </div>


    <div class="card">
      <h3>Student Results</h3>
      <div id="resultsList">
        <p>No results yet.</p>
      </div>
    </div>


    <div class="card drawer">
      <div class="drawer-header" onclick="toggleDrawer('studentsDrawer')">
        <h3>Students</h3>
        <span class="drawer-icon">▼</span>
      </div>
      <div id="studentsDrawer" class="drawer-content">
        <div id="studentList"></div>
      </div>
    </div>
   

    <button onclick="logout()">Logout</button>
  </div>

  <div id="assignModal" class="modal hidden">
    <div class="modal-content">
      <h3 id="assignModalTitle">Assign Quiz</h3>
  
      <div id="assignStudentList">
        <p>No students found.</p>
      </div>
  
      <div class="modal-actions">
        <button id="confirmAssignBtn">Assign Selected</button>
        <button type="button" onclick="closeAssignModal()">Cancel</button>
      </div>
  
      <p id="assignModalMsg"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
